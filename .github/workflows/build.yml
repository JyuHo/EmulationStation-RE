name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  arch:
    name: Arch Linux (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git cmake ninja clang \
            sdl2-compat boost freetype2 eigen curl alsa-lib libglvnd mesa libwebp

      - uses: actions/checkout@v5

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build build

      - name: Smoke test
        run: ./build/emulationstation --help
