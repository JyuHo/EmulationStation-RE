name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  arch:
    name: Arch Linux (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git cmake ninja clang \
            sdl2-compat freetype2 fontconfig eigen curl alsa-lib libglvnd mesa libwebp \
            catch2 xorg-server-xvfb imagemagick
          # French locale for test_Locale (decimal comma). The Docker image strips
          # locale sources through NoExtract, so reinstall glibc without it first.
          sed -i '/^NoExtract/d' /etc/pacman.conf
          pacman -S --noconfirm glibc
          sed -i 's/^#fr_FR.UTF-8/fr_FR.UTF-8/' /etc/locale.gen && locale-gen

      - uses: actions/checkout@v5

      - name: No hardcoded paths
        run: |
          # Every file location goes through es::paths (es-core/src/utils/Paths.*).
          if grep -rnE '"/(etc|usr|opt|home)/|\.emulationstation|getenv\("HOME"\)|getHomePath' \
              es-core/src es-app/src --exclude=Paths.cpp --exclude=Paths.h; then
            echo "Hardcoded path found: use es::paths instead." >&2
            exit 1
          fi

      - name: No Windows or embedded leftovers
        run: |
          # Linux desktop only: no Windows, macOS, Raspberry Pi or OpenGL ES branches.
          if grep -rnE '\b_?WIN32\b|__APPLE__|_RPI_|USE_OPENGL_ES|_MSC_VER' es-core/src es-app/src tests; then
            echo "Platform leftover found: this port targets Linux only." >&2
            exit 1
          fi

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DES_BUILD_TESTS=ON \
            -DES_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test (Xvfb)
        run: tests/smoke/run.sh build/emulationstation 6 smoke-${{ matrix.compiler }}.png

      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.compiler }}
          path: smoke-${{ matrix.compiler }}.png
          if-no-files-found: ignore

  asan:
    name: Arch Linux (gcc, ASan + UBSan)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git cmake ninja \
            sdl2-compat freetype2 fontconfig eigen curl alsa-lib libglvnd mesa libwebp \
            catch2 xorg-server-xvfb
          # French locale for test_Locale (decimal comma). The Docker image strips
          # locale sources through NoExtract, so reinstall glibc without it first.
          sed -i '/^NoExtract/d' /etc/pacman.conf
          pacman -S --noconfirm glibc
          sed -i 's/^#fr_FR.UTF-8/fr_FR.UTF-8/' /etc/locale.gen && locale-gen

      - uses: actions/checkout@v5

      - name: Configure
        run: cmake --preset asan -DES_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset asan

      - name: Unit tests
        run: ctest --preset asan

      - name: Smoke test (Xvfb)
        run: tests/smoke/run.sh build/asan/emulationstation 10
